name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check plugins, skills and files
        run: python3 tools/validate.py
      - name: Check install.sh
        run: |
          bash -n install.sh
          ./install.sh --list
          ./install.sh --dest "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/markdown-docs/SKILL.md"
